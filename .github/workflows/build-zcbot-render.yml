name: build-zcbot-render

# 编译 image_renderer 插件的原生扩展（Windows .pyd / Linux .so，abi3 兼容 Python 3.9+）
# 构建产物以 Artifact 形式上传，下载后放入 plugins/image_renderer/native/bin/<平台>/
on:
  workflow_dispatch:
  push:
    paths:
      - 'plugins/image_renderer/native/**'
      - '.github/workflows/build-zcbot-render.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install maturin
        run: pip install maturin

      - name: Build extension (abi3)
        working-directory: plugins/image_renderer/native
        run: maturin build --release

      - name: Extract raw extension (.pyd/.so)
        shell: bash
        run: |
          set -e
          cd plugins/image_renderer/native
          python - <<'EOF'
          import glob, os, shutil, zipfile
          wheel = glob.glob('target/wheels/*.whl')[0]
          out = 'bin_extract'
          os.makedirs(out, exist_ok=True)
          with zipfile.ZipFile(wheel) as z:
              names = [n for n in z.namelist() if n.endswith(('.pyd', '.so'))]
              for n in names:
                  z.extract(n, out)
                  ext = os.path.splitext(n)[1]
                  shutil.copy(os.path.join(out, n), os.path.join(out, 'zcbot_render' + ext))
          print([f for f in os.listdir(out)])
          EOF

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: zcbot_render-${{ matrix.os }}
          path: plugins/image_renderer/native/bin_extract/zcbot_render.*
