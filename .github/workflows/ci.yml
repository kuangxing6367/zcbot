# 快速闸门：多版本语法兼容 + 启动冒烟 + WebUI 产物校验（秒级反馈）
#
# 分层约定（2026-11-14 起）：
#   ci.yml    —— 本文件。多版本 compileall + 启动冒烟 + 前端产物校验，快速失败
#   tests.yml —— 权威测试流。矩阵全量 pytest + 脚本式回归 + DB 一致性 + 覆盖率
#
# 为什么这里不再跑测试
# ====================
# 本文件原先维护着一份手写测试文件清单，tests.yml 里还有另一份，两份互相错位
# ——26 个测试文件、342 个用例不在任何 CI 里执行（含三个安全套件）。
# 测试口径现在收敛到 tests.yml 单一入口（`pytest tests` 全量），本文件只保留
# 与「能不能装上、能不能起来、语法在各版本是否合法」相关的快速检查。
name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 官方插件依赖（aiwriter 的 textual 等）未在 requirements.txt 声明，
          # 启动冒烟会加载插件，需装齐。
          for f in core_plugins/*/requirements.txt; do
            [ -f "$f" ] && pip install -r "$f"
          done

      # 语法兼容性：matrix 里每个版本都要能 import 整个包树。
      - name: Compile check
        run: python -m compileall -q framework core_plugins

      # 启动冒烟：走脚本入口（tests/test_smoke.py 同时兼容脚本与 pytest 两种方式，
      # 全量用例在 tests.yml 跑，这里只验证「能起、能派发一轮」）。
      - name: Startup smoke
        run: python tests/test_smoke.py

  # ── WebUI：构建产物存在性检查 ──────────────────────────────
  # 前端源码为闭源资产（不进仓库），仅发布 core_plugins/webui/web 构建产物。
  # 仓库不含 webui/ 源码，CI 无法从源码构建；本作业改为校验已提交的发布产物。
  # v1.20.0 曾漏推 >1MB 的 element-plus chunk 导致新 clone 白屏；
  # 现在校验 index.html / chunk 内所有 hash 引用真实存在（见 tools/check_webui_artifact.py）。
  webui-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify WebUI artifact present
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_webui_artifact.py --root core_plugins/webui/web
