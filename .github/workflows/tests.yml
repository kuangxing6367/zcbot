# 权威测试流：Python 全量回归 + 冒烟（不编译原生扩展、不部署文档）
#
# 分层约定（2026-11-14 起）：
#   ci.yml    —— 快速闸门：多版本 compileall + WebUI 产物校验，秒级返回
#   tests.yml —— 权威测试：矩阵全量 pytest + 脚本式回归 + DB 一致性 + 覆盖率归档
#
# 为什么不再手写文件清单
# ====================
# v1.22.0 审计发现：ci.yml 与 tests.yml 各自维护一份手写测试文件清单，两份内容
# 互相错位——26 个测试文件、342 个用例不在任何 CI 里执行，其中包含
# test_api_security / test_p0_security_regressions / test_security_hardening
# 三个安全套件。还有 14 个文件的用例函数体零 assert，被 pytest 收集到却永远 PASS。
#
# 手写清单的失效模式是静默的：新增文件忘了加进 YAML 不报错，评审也看不出来。
# 现在改为：
#   1. 脚本式文件由 tools/run_script_tests.py 静态分析自动发现并逐个执行；
#   2. 其余全部交给 `pytest tests`，不列文件名；
#   3. tools/run_script_tests.py --check 断言用例数不低于基线，防止 --ignore 悄悄丢用例。
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          # 3.14 观察一轮：requires-python 无上界，等于对外声明支持，但此前
          # 全量测试从未在 3.13/3.14 上跑过（ci.yml 只在 3.13/3.14 跑 compileall）。
          # 跑绿一轮后把 experimental 去掉，转为正式矩阵成员。
          - python-version: "3.14"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install plugin/test optional dependencies
        run: |
          # 测试套件覆盖 Web 层（flask 契约）与官方插件（aiwriter 的 textual、image_renderer 的 Pillow），
          # 这些在 requirements.txt 中是「启用时自动安装」的可选依赖；CI 跑全量测试需提前装齐。
          for f in core_plugins/*/requirements.txt; do
            [ -f "$f" ] && pip install -r "$f"
          done
      - name: Install test runners
        run: |
          # pytest-asyncio 锁 <1.0：1.0 改了默认模式，与 ci.yml 保持同一口径。
          # pytest-cov 只采集不设阈值——当前语句覆盖率约 50%，先在 CI 里沉淀
          # 历史曲线，等水位稳定再上 ratchet（只许升不许降）。
          pip install pytest "pytest-asyncio>=0.21,<1.0" pytest-timeout pytest-cov

      # ── 脚本式回归 ────────────────────────────────────────────────
      # 断言写在 check() 里、失败时 sys.exit 的文件：pytest 要么收集 0 个用例
      # （整个文件不执行），要么收集到但函数体零 assert（永远 PASS）。
      # 清单由 AST 静态分析生成，新增文件自动纳入。
      - name: Script-style regressions (auto-discovered)
        run: python tools/run_script_tests.py

      # ── 全量 pytest ───────────────────────────────────────────────
      # 不列文件名。db_conformance 单独跑（自带 conftest 参数化，未来接 MySQL 后端）。
      - name: Pytest suite (full)
        run: |
          python -m pytest tests --ignore=tests/db_conformance -q --timeout=180 \
            --cov=framework --cov=core_plugins \
            --cov-report=xml:coverage.xml --cov-report=term:skip-covered

      # ── 用例数护栏 ────────────────────────────────────────────────
      # 收集数低于基线通常意味着 pytest 调用被加了 --ignore/-k/--deselect，
      # 或者测试文件被误删。确认是有意变更后上调 tools/run_script_tests.py。
      - name: Assert collected case count
        run: python tools/run_script_tests.py --check

      - name: Upload coverage xml
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-3.12
          path: coverage.xml
          retention-days: 14
          if-no-files-found: warn

      # ── 多后端一致性套件（默认 sqlite，无需 MySQL）────────────────
      # tests/db_conformance 自带 conftest 参数化，--db 默认 sqlite；
      # 覆盖 schema 对齐、事务、类型映射、方言翻译与并发，共 51 例。
      - name: DB conformance suite (sqlite)
        run: python -m pytest tests/db_conformance -q

      # ── 工作区护栏：污染守卫 + 测试残留守卫 ──────────────────
      # 本作业 pytest 未加 -p no:cacheprovider，会正常产生 .pytest_cache/ 与
      # __pycache__/——已被 .gitignore 覆盖，git status 不可见，天然放行；
      # 例外放行项目有意跟踪的 native/bin 发布二进制。细则见脚本内注释。
      - name: Workspace guard (pollution + test residue)
        run: bash .github/scripts/guard_workspace.sh

  # ── Windows 冒烟 ────────────────────────────────────────────────────
  # 此前 CI 全部跑在 ubuntu-latest，而本项目的主要使用与开发平台是 Windows
  # （裸机部署、桌面托盘、.pyd 原生扩展）。这里是观察期：失败不阻塞主干，
  # 但会把失败清单打成 annotation 并上传完整日志，便于定位后再转硬门禁。
  windows-smoke:
    runs-on: windows-latest
    # 不整作业 continue-on-error：装不上 / 起不来 / 脚本式回归挂 -> 直接红。
    # 只有「全量 pytest」这一步是观察项（步骤级 continue-on-error），
    # 因为 Windows 与 Linux 的差异需要先观察再做硬约束。
    # Windows runner 的 stdio 默认是 cp1252，而本项目的日志与测试输出含中文，
    # 直接 print 就会 UnicodeEncodeError（Linux 上 UTF-8 默认，所以从没暴露）。
    # PYTHONUTF8 同时把文件读写默认编码拉到 UTF-8，避免 GBK/CP1252 来回转。
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 记录装不上的插件依赖（例如需要本地编译的原生扩展），
          # 它们会导致对应插件的测试 ImportError —— 打出来比静默跳过好。
          failed=""
          for f in core_plugins/*/requirements.txt; do
            [ -f "$f" ] || continue
            pip install -r "$f" || failed="$failed $f"
          done
          pip install pytest "pytest-asyncio>=0.21,<1.0" pytest-timeout
          if [ -n "$failed" ]; then
            echo "::warning title=插件依赖安装失败::未装成功:$failed"
          fi

      # 硬门禁 1：启动冒烟（装得上、起得来、能派发一轮）
      # 失败时把末尾 30 行打成 annotation——Windows 的失败大多来自编码/路径，
      # 没有这段输出就只能去网页翻日志。
      - name: Startup smoke (script-style)
        shell: bash
        run: |
          set +e
          python tests/test_smoke.py > smoke-win.log 2>&1
          rc=$?
          tail -60 smoke-win.log
          if [ "$rc" -ne 0 ]; then
            tail -30 smoke-win.log \
              | while IFS= read -r line; do echo "::error title=windows-smoke::$line"; done
          fi
          exit $rc

      # 硬门禁 2：脚本式回归（断言在 check() 里、失败 sys.exit 的那批）
      - name: Script-style regressions
        shell: bash
        run: python tools/run_script_tests.py

      # 观察项：全量 pytest。失败不阻塞作业，但把 FAILED/ERROR 逐条打成
      # annotation，并把完整日志作为 artifact 上传——Windows 与 Linux 的差异
      # 要能看到才好修。这一轮（6f981ec）已跑通，再观察一版即可转硬。
      - name: Full pytest suite (observing)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest tests --ignore=tests/db_conformance -q --timeout=240 \
            --tb=no -rf > pytest-win.log 2>&1
          rc=$?
          echo "----- 失败清单（前 25 条）-----"
          fail_lines=$(grep -E "^(FAILED|ERROR)" pytest-win.log | head -25)
          if [ -z "$fail_lines" ]; then
            echo "(无 FAILED/ERROR 行)"
          else
            echo "$fail_lines"
            echo "$fail_lines" \
              | while IFS= read -r line; do echo "::error title=windows-full::$line"; done
          fi
          echo "----- 汇总 -----"
          tail -3 pytest-win.log
          exit $rc

      - name: Upload windows logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-logs
          path: |
            pytest-win.log
            smoke-win.log
          retention-days: 14
          if-no-files-found: warn

  # ── 静态契约门禁 ────────────────────────────────────────────────────
  # 插件模块级 ctx 是加载期注入的（module.ctx = ctx），静态检查天生看不见。
  # 官方插件现在用「TYPE_CHECKING + cast 占位」显式声明名字与类型；这里把
  # 未定义名锁死在 0 条，防止新增插件又写出裸 ctx 或漏导入（历史上一次 204 条）。
  # 只跑 F821：其余 4000+ 条历史 lint 告警属于独立的技术债，不在本门禁范围。
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install "ruff>=0.6"
      - name: No undefined names (F821)
        run: python -m ruff check --isolated --select F821 .
      # 只锁已经清零的规则，不做全量 lint 门禁：仓库仍有约 3k 条历史违规
      # （盲 except、超长函数等）需要分阶段治理，一次性开全量会让主干永远红。
      # 新增规则进这里的前提是同一提交里先把它清零。
      - name: Lint gate (已清零规则，禁止回涨)
        run: >-
          python -m ruff check
          --select UP009,I001,UP032,F541,PIE790,RET501,PLR1711,RUF022,FURB167,UP006,UP045,RUF100
          .
