# 运行 Python 回归 + 冒烟（不编译原生扩展、不部署文档）
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Plugin import regression
        run: python tests/test_plugin_imports.py
      - name: Dual-core regression
        run: python tests/test_dual_core.py
      - name: Permission engine regression
        run: python tests/test_perm.py
      - name: Startup + dispatch smoke
        run: python tests/test_smoke.py
      # pytest 用例与脚本式回归并存：显式列文件（其余 test_*.py 是模块级 sys.exit 的脚本，
      # 被 pytest 收集会 INTERNALERROR），test_smoke.py 本身两种方式兼容
      - name: Pytest suite (smoke + html_assembler + event_buffer + qq_official)
        run: |
          pip install pytest
          python -m pytest tests/test_smoke.py tests/test_html_assembler.py tests/test_event_buffer.py tests/test_qq_official.py -q
