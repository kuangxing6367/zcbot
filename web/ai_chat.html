<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 对话 · zcbot</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .chat-container { display:flex; flex-direction:column; height:calc(100vh - 140px); max-width:860px; margin:0 auto; }
        .chat-messages { flex:1; overflow-y:auto; padding:16px 0; scroll-behavior:smooth; }
        .chat-msg { display:flex; gap:12px; margin-bottom:20px; animation:fadeIn 0.3s ease; }
        .chat-msg.user { flex-direction:row-reverse; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .chat-avatar { width:36px; height:36px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:16px; }
        .chat-avatar.bot { background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; }
        .chat-avatar.user { background:linear-gradient(135deg,#22c55e,#16a34a); color:#fff; }
        .chat-bubble { max-width:75%; padding:12px 16px; border-radius:16px; font-size:14px; line-height:1.7; word-break:break-word; white-space:pre-wrap; }
        .chat-bubble.bot { background:var(--card-bg); border:1px solid var(--border); color:var(--text); border-bottom-left-radius:4px; }
        .chat-bubble.user { background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
        .chat-time { font-size:11px; color:var(--text-secondary); margin-top:4px; text-align:right; }
        .chat-input-area { background:var(--card-bg); border:1px solid var(--border); border-radius:16px; padding:8px 12px; display:flex; gap:8px; align-items:flex-end; }
        .chat-input-area textarea { flex:1; border:none; background:transparent; color:var(--text); font-size:14px; resize:none; outline:none; min-height:44px; max-height:120px; line-height:1.5; font-family:inherit; padding:8px 0; }
        .chat-input-area .btn-send { width:40px; height:40px; border-radius:50%; border:none; background:var(--accent); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; flex-shrink:0; font-size:18px; }
        .chat-input-area .btn-send:hover { transform:scale(1.05); box-shadow:0 4px 12px rgba(99,102,241,0.3); }
        .chat-input-area .btn-send:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
        .typing-dots { display:flex; gap:4px; padding:4px 0; }
        .typing-dots span { width:6px; height:6px; border-radius:50%; background:var(--text-secondary); animation:bounce 1.4s infinite; }
        .typing-dots span:nth-child(2) { animation-delay:0.2s; }
        .typing-dots span:nth-child(3) { animation-delay:0.4s; }
        @keyframes bounce { 0%,60%,100% { transform:translateY(0); } 30% { transform:translateY(-6px); } }
        .empty-chat { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--text-secondary); }
        .empty-chat .icon { font-size:48px; margin-bottom:12px; opacity:0.5; }
        .empty-chat .hint { font-size:14px; max-width:400px; text-align:center; line-height:1.8; }
        .chat-toolbar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
        .chat-toolbar button { padding:6px 14px; border:1px solid var(--border); border-radius:20px; background:var(--card-bg); color:var(--text-secondary); font-size:12px; cursor:pointer; transition:all 0.15s; font-family:inherit; }
        .chat-toolbar button:hover { border-color:var(--accent); color:var(--text); background:var(--surface-hover); }
        @media (max-width:720px) {
            .chat-container { height:calc(100vh - 120px); padding:0 8px; }
            .chat-bubble { max-width:85%; font-size:13px; }
        }
    </style>
</head>
<body>
    <div class="main" style="padding-bottom:0;">
        <h1 class="page-title">AI 对话</h1>
        <p class="page-subtitle" style="margin-bottom:12px;">与 LLM 对话 · 使用 API 池中的配置</p>

        <div class="chat-toolbar">
            <button onclick="clearChat()">清空对话</button>
            <button onclick="loadHistory()">刷新</button>
        </div>

        <div class="chat-container">
            <div class="chat-messages" id="msgArea">
                <div class="empty-chat" id="emptyHint">
                    <div class="icon"></div>
                    <div class="hint">输入消息开始与 AI 对话<br>支持 DeepSeek / OpenAI / Gemini 等多模型</div>
                </div>
            </div>
            <div class="chat-input-area">
                <textarea id="msgInput" rows="1" placeholder="输入消息..." onkeydown="onKeyDown(event)" oninput="autoResize(this)"></textarea>
                <button class="btn-send" id="sendBtn" onclick="sendMsg()"></button>
            </div>
        </div>
    </div>



    <script src="/js/common.js"></script>
    <script>
        let isSending = false;

        initPage('ai', function() {
            loadHistory();
        });

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 120) + 'px';
        }

        function onKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMsg();
            }
        }

        function addMessage(role, content, time) {
            const area = document.getElementById('msgArea');
            const empty = document.getElementById('emptyHint');
            if (empty) empty.style.display = 'none';

            const ts = time || new Date().toLocaleTimeString();
            const isUser = role === 'user';
            const div = document.createElement('div');
            div.className = `chat-msg ${isUser ? 'user' : ''}`;
            div.innerHTML = `
                <div class="chat-avatar ${isUser ? 'user' : 'bot'}">${isUser ? 'U' : 'AI'}</div>
                <div>
                    <div class="chat-bubble ${isUser ? 'user' : 'bot'}">${escapeHtml(content)}</div>
                    <div class="chat-time">${ts}</div>
                </div>`;
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
            return div;
        }

        function showTyping() {
            const area = document.getElementById('msgArea');
            const empty = document.getElementById('emptyHint');
            if (empty) empty.style.display = 'none';

            const div = document.createElement('div');
            div.className = 'chat-msg';
            div.id = 'typingIndicator';
            div.innerHTML = `
                <div class="chat-avatar bot">AI</div>
                <div>
                    <div class="chat-bubble bot">
                        <div class="typing-dots"><span></span><span></span><span></span></div>
                    </div>
                </div>`;
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        async function sendMsg() {
            if (isSending) return;
            const input = document.getElementById('msgInput');
            const msg = input.value.trim();
            if (!msg) return;

            input.value = '';
            autoResize(input);
            addMessage('user', msg);

            isSending = true;
            document.getElementById('sendBtn').disabled = true;
            showTyping();

            try {
                const res = await api('/api/ai/chat', {
                    method: 'POST',
                    body: JSON.stringify({ message: msg })
                });
                hideTyping();
                if (res && res.code === 0) {
                    addMessage('assistant', res.data.reply);
                } else {
                    addMessage('assistant', ' ' + (res ? res.msg : '请求失败'));
                }
            } catch(e) {
                hideTyping();
                addMessage('assistant', ' 网络错误: ' + e.message);
            } finally {
                isSending = false;
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('msgInput').focus();
            }
        }

        function clearChat() {
            if (!confirm('确定清空所有对话记录吗？')) return;
            document.getElementById('msgArea').innerHTML = `
                <div class="empty-chat" id="emptyHint">
                    <div class="icon"></div>
                    <div class="hint">输入消息开始与 AI 对话</div>
                </div>`;
        }

        function loadHistory() {
            // 简单的刷新：重新加载页面即可
            // 后续可以扩展为从后端加载历史
        }
    </script>
</body>
</html>
