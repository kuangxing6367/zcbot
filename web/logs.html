<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志中心 · zcbot</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .tab-nav { display:flex; gap:4px; background:var(--card-bg); border-radius:12px; padding:4px; box-shadow:var(--shadow); margin-bottom:20px; overflow-x:auto; }
        .tab-item { flex:1; min-width:100px; padding:10px 16px; border:none; background:transparent; color:var(--text-secondary); font-size:14px; font-weight:500; cursor:pointer; border-radius:8px; transition:all 0.2s; white-space:nowrap; font-family:inherit; }
        .tab-item:hover { background:var(--bg); color:var(--text); }
        .tab-item.active { background:var(--accent); color:#fff; box-shadow:0 2px 8px rgba(99,102,241,0.3); }
        .tab-panel { display:none; }
        .tab-panel.active { display:block; }

        .filter-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
        .filter-chip { padding:6px 14px; border:1px solid var(--border); background:var(--card-bg); color:var(--text-secondary); border-radius:20px; font-size:13px; cursor:pointer; transition:all 0.15s; font-family:inherit; }
        .filter-chip:hover { border-color:var(--accent); color:var(--text); }
        .filter-chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
        .filter-chip .count { font-size:11px; opacity:0.7; margin-left:4px; }

        .log-stream { background:var(--card-bg); border-radius:12px; box-shadow:var(--shadow); max-height:65vh; overflow-y:auto; padding:4px; }
        .log-entry { display:flex; gap:12px; padding:10px 16px; border-bottom:1px solid var(--border); font-size:13px; line-height:1.5; transition:background 0.1s; }
        .log-entry:hover { background:var(--bg); }
        .log-entry:last-child { border-bottom:none; }
        .log-entry .log-time { color:var(--text-secondary); font-size:12px; min-width:70px; font-variant-numeric:tabular-nums; flex-shrink:0; }
        .log-entry .log-tag { min-width:50px; text-align:center; flex-shrink:0; }
        .log-entry .log-level { min-width:40px; text-align:center; font-weight:600; font-size:11px; padding:2px 6px; border-radius:4px; flex-shrink:0; }
        .log-entry .log-source { min-width:80px; max-width:120px; overflow:hidden; text-overflow:ellipsis; font-size:11px; color:var(--text-secondary); flex-shrink:0; }
        .log-entry .log-msg { flex:1; word-break:break-word; min-width:0; }
        .log-entry .log-detail { color:var(--text-secondary); font-size:12px; margin-top:4px; padding:6px 10px; background:var(--bg); border-radius:6px; font-family:'SF Mono','Consolas',monospace; white-space:pre-wrap; word-break:break-all; }

        .tag-message { background:var(--accent-bg); color:var(--accent); }
        .tag-connection { background:#e8f5e9; color:#2e7d32; }
        .tag-plugin { background:#fff3e0; color:#e65100; }
        .tag-system { background:#e3f2fd; color:#1565c0; }
        .tag-framework { background:#f3e5f5; color:#7b1fa2; }
        @media (prefers-color-scheme:dark) {
            .tag-message { background:rgba(129,140,248,0.15); color:#818cf8; }
            .tag-connection { background:rgba(48,209,88,0.15); color:#30d158; }
            .tag-plugin { background:rgba(255,159,10,0.15); color:#ff9f0a; }
            .tag-system { background:rgba(100,170,255,0.15); color:#64aaff; }
            .tag-framework { background:rgba(186,104,200,0.15); color:#ba68c8; }
        }

        .lvl-DEBUG { background:rgba(33,150,243,0.1); color:#2196f3; }
        .lvl-INFO { background:rgba(99,102,241,0.1); color:var(--accent); }
        .lvl-WARN { background:rgba(230,81,0,0.1); color:var(--status-warn); }
        .lvl-ERROR { background:rgba(198,40,40,0.1); color:var(--status-error); }
        @media (prefers-color-scheme:dark) {
            .lvl-DEBUG { background:rgba(100,181,246,0.15); color:#64b5f6; }
            .lvl-INFO { background:rgba(129,140,248,0.15); color:#818cf8; }
            .lvl-WARN { background:rgba(255,159,10,0.15); color:#ff9f0a; }
            .lvl-ERROR { background:rgba(255,69,58,0.15); color:#ff453a; }
        }

        .live-indicator { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--text-secondary); }
        .live-dot { width:8px; height:8px; border-radius:50%; background:var(--status-ok); animation:pulse 1.5s infinite; }
        .live-dot.paused { background:var(--text-secondary); animation:none; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

        .btn-sm { padding:6px 14px; font-size:13px; border-radius:8px; border:1px solid var(--border); background:var(--card-bg); color:var(--text); cursor:pointer; font-family:inherit; transition:all 0.15s; }
        .btn-sm:hover { border-color:var(--accent); }
        .btn-sm.danger { color:var(--status-error); border-color:var(--status-error); }

        .search-input { padding:6px 14px; border:1px solid var(--border); border-radius:20px; font-size:13px; background:var(--card-bg); color:var(--text); font-family:inherit; outline:none; min-width:180px; }
        .search-input:focus { border-color:var(--accent); }

        .level-filter { display:flex; gap:4px; }
        .level-chip { padding:4px 10px; font-size:11px; font-weight:600; border-radius:6px; cursor:pointer; border:1px solid var(--border); background:var(--card-bg); font-family:inherit; transition:all 0.15s; }
        .level-chip.active { opacity:1; }
        .level-chip.inactive { opacity:0.35; }
    </style>
</head>
<body>
    <div class="main">
        <h1 class="page-title">日志中心</h1>
        <p class="page-subtitle">审计日志 · 运行日志 · 实时监控（SSE 推送）</p>

        <div class="tab-nav">
            <button class="tab-item active" onclick="switchTab('audit')">审计日志</button>
            <button class="tab-item" onclick="switchTab('runtime')">运行日志</button>
            <button class="tab-item" onclick="switchTab('live')">实时监控</button>
        </div>

        <!-- 审计日志面板 -->
        <div class="tab-panel active" id="panel-audit">
            <div class="card">
                <div class="card-title">管理员操作记录</div>
                <div id="logArea"><div class="empty"><div class="loading-spinner"></div> 加载中...</div></div>
                <div id="logPager" class="pagination"></div>
            </div>
        </div>

        <!-- 运行日志面板 -->
        <div class="tab-panel" id="panel-runtime">
            <div class="filter-bar">
                <button class="filter-chip active" onclick="setRuntimeFilter('')">全部 <span class="count" id="cnt-all"></span></button>
                <button class="filter-chip" onclick="setRuntimeFilter('message')">消息 <span class="count" id="cnt-message"></span></button>
                <button class="filter-chip" onclick="setRuntimeFilter('connection')">连接 <span class="count" id="cnt-connection"></span></button>
                <button class="filter-chip" onclick="setRuntimeFilter('plugin')">插件 <span class="count" id="cnt-plugin"></span></button>
                <button class="filter-chip" onclick="setRuntimeFilter('system')">系统 <span class="count" id="cnt-system"></span></button>
                <button class="filter-chip" onclick="setRuntimeFilter('framework')">框架 <span class="count" id="cnt-framework"></span></button>
                <input type="text" class="search-input" id="runtimeSearch" placeholder="搜索日志..." oninput="debouncedLoadRuntime()">
                <button class="btn-sm" onclick="loadRuntimeLogs(true)">刷新</button>
                <button class="btn-sm danger" onclick="clearRuntimeLogs()">清空</button>
            </div>
            <div class="log-stream" id="runtimeLogStream">
                <div class="empty" style="padding:40px;">点击「刷新」加载日志</div>
            </div>
        </div>

        <!-- 实时监控面板 -->
        <div class="tab-panel" id="panel-live">
            <div class="filter-bar">
                <div class="live-indicator">
                    <span class="live-dot" id="liveDot"></span>
                    <span id="liveStatus">连接中...</span>
                </div>
                <button class="filter-chip active" onclick="setLiveFilter('')">全部</button>
                <button class="filter-chip" onclick="setLiveFilter('message')">消息</button>
                <button class="filter-chip" onclick="setLiveFilter('connection')">连接</button>
                <button class="filter-chip" onclick="setLiveFilter('plugin')">插件</button>
                <button class="filter-chip" onclick="setLiveFilter('system')">系统</button>
                <button class="filter-chip" onclick="setLiveFilter('framework')">框架</button>
                <div class="level-filter">
                    <span class="level-chip active lvl-INFO" onclick="toggleLevel('INFO')">INFO</span>
                    <span class="level-chip active lvl-WARN" onclick="toggleLevel('WARN')">WARN</span>
                    <span class="level-chip active lvl-ERROR" onclick="toggleLevel('ERROR')">ERROR</span>
                    <span class="level-chip active lvl-DEBUG" onclick="toggleLevel('DEBUG')">DEBUG</span>
                </div>
                <input type="text" class="search-input" id="liveSearch" placeholder="搜索..." oninput="renderLive()">
                <button class="btn-sm" onclick="toggleLive()" id="liveToggleBtn">暂停</button>
                <button class="btn-sm danger" onclick="clearLiveLogs()">清空</button>
                <span style="margin-left:auto;font-size:13px;color:var(--text-secondary);">SEQ: <span id="liveSeq">0</span></span>
            </div>
            <div class="log-stream" id="liveLogStream" style="min-height:300px;">
                <div class="empty" style="padding:40px;">等待日志流入...</div>
            </div>
        </div>
    </div>



    <script src="/js/common.js"></script>
    <script>
        initPage('logs', async function() {
            await loadLogs(1);
        });

        // ---- Tab 切换 ----
        function switchTab(name) {
            document.querySelectorAll('.tab-item').forEach((el, i) => {
                el.classList.toggle('active', ['audit','runtime','live'][i] === name);
            });
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('panel-' + name).classList.add('active');

            if (name === 'runtime') loadRuntimeLogs(true);
            if (name === 'live') startLive();
            else stopLive();
        }

        // ---- 审计日志 ----
        const ACTION_LABELS = {
            login: '登录', logout: '登出', change_password: '修改密码',
            upload_plugin: '上传插件', reload_plugin: '重载插件',
            enable_plugin: '启用插件', disable_plugin: '禁用插件', delete_plugin: '删除插件',
            add_dynamic_command: '添加动态命令', delete_dynamic_command: '删除动态命令',
            edit_dynamic_command: '编辑动态命令',
            enable_dynamic_command: '启用动态命令', disable_dynamic_command: '禁用动态命令',
            update_command_alias: '更新命令别名',
            enable_static_command: '启用静态命令', disable_static_command: '禁用静态命令',
            blacklist_user: '拉黑用户', unblacklist_user: '取消拉黑用户',
            blacklist_group: '拉黑群', unblacklist_group: '取消拉黑群',
            update_config: '更新配置', add_admin: '添加管理员', delete_admin: '删除管理员',
            clear_runtime_logs: '清空运行日志', update_plugin_github: 'GitHub更新插件',
        };

        async function loadLogs(page) {
            const res = await api(`/api/audit_logs?page=${page}&size=30`);
            if (!res || res.code !== 0) return;
            const area = document.getElementById('logArea');
            const rows = res.data || [];
            if (rows.length === 0) {
                area.innerHTML = '<div class="empty">暂无日志记录</div>';
                document.getElementById('logPager').innerHTML = '';
                return;
            }
            area.innerHTML = `<div class="tbl-wrap"><table class="tbl">
                <thead><tr><th>ID</th><th>管理员</th><th>操作</th><th>目标</th><th>详情</th><th>IP</th><th>结果</th><th>时间</th></tr></thead>
                <tbody>${rows.map(l => `
                    <tr>
                        <td>${l.id}</td>
                        <td>${escapeHtml(l.admin_name || '-')}</td>
                        <td><span class="badge badge-info">${ACTION_LABELS[l.action] || l.action}</span></td>
                        <td>${l.target_type ? escapeHtml(l.target_type) + ': ' + escapeHtml(l.target_name || '-') : '-'}</td>
                        <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(l.detail || '')}">${escapeHtml(l.detail || '-')}</td>
                        <td>${escapeHtml(l.ip_address || '-')}</td>
                        <td>${l.result === 'success' ? '<span class="badge badge-ok">成功</span>' : '<span class="badge badge-error">失败</span>'}</td>
                        <td>${formatDate(l.created_at)}</td>
                    </tr>`).join('')}
                </tbody></table></div>`;
            renderPager('logPager', page, Math.ceil(res.total / res.size), loadLogs);
        }

        function renderPager(containerId, current, totalPages, callback) {
            const el = document.getElementById(containerId);
            if (totalPages <= 1) { el.innerHTML = ''; return; }
            let html = '';
            html += `<button ${current <= 1 ? 'disabled' : ''} onclick="loadLogs(${current - 1})">上一页</button>`;
            const start = Math.max(1, current - 2);
            const end = Math.min(totalPages, current + 2);
            if (start > 1) html += `<button onclick="loadLogs(1)">1</button>`;
            if (start > 2) html += '<button disabled>...</button>';
            for (let i = start; i <= end; i++) {
                html += `<button class="${i === current ? 'active' : ''}" onclick="loadLogs(${i})">${i}</button>`;
            }
            if (end < totalPages - 1) html += '<button disabled>...</button>';
            if (end < totalPages) html += `<button onclick="loadLogs(${totalPages})">${totalPages}</button>`;
            html += `<button ${current >= totalPages ? 'disabled' : ''} onclick="loadLogs(${current + 1})">下一页</button>`;
            el.innerHTML = html;
        }

        // ---- 运行日志 ----
        let runtimeFilter = '';
        let runtimeSearchTimer = null;

        function setRuntimeFilter(cat) {
            runtimeFilter = cat;
            document.querySelectorAll('#panel-runtime .filter-chip').forEach(c => c.classList.remove('active'));
            event.target.closest('.filter-chip').classList.add('active');
            loadRuntimeLogs(true);
        }

        function debouncedLoadRuntime() {
            if (runtimeSearchTimer) clearTimeout(runtimeSearchTimer);
            runtimeSearchTimer = setTimeout(() => loadRuntimeLogs(true), 300);
        }

        async function loadRuntimeLogs(force) {
            const search = document.getElementById('runtimeSearch').value.trim();
            const params = new URLSearchParams({ limit: '200' });
            if (runtimeFilter) params.set('category', runtimeFilter);
            if (search) params.set('keyword', search);
            const res = await api(`/api/runtime_logs?${params}`);
            if (!res || res.code !== 0) return;
            renderLogEntries('runtimeLogStream', res.data);
            updateLogCounts();
        }

        async function updateLogCounts() {
            const res = await api('/api/runtime_logs/stats');
            if (!res || res.code !== 0) return;
            const s = res.data;
            document.getElementById('cnt-all').textContent = `(${s.total})`;
            document.getElementById('cnt-message').textContent = `(${s.by_category.message || 0})`;
            document.getElementById('cnt-connection').textContent = `(${s.by_category.connection || 0})`;
            document.getElementById('cnt-plugin').textContent = `(${s.by_category.plugin || 0})`;
            document.getElementById('cnt-system').textContent = `(${s.by_category.system || 0})`;
            document.getElementById('cnt-framework').textContent = `(${s.by_category.framework || 0})`;
        }

        async function clearRuntimeLogs() {
            if (!confirm('确定清空所有运行日志？')) return;
            await api('/api/runtime_logs/clear', { method: 'POST' });
            loadRuntimeLogs(true);
        }

        // ---- 实时监控（SSE 推送，参考 AstrBot ConsoleDisplayer）----
        let liveFilter = '';
        let liveEntries = [];
        let liveSSE = null;
        let livePaused = false;
        let liveLevels = { INFO: true, WARN: true, ERROR: true, DEBUG: true };

        function setLiveFilter(cat) {
            liveFilter = cat;
            document.querySelectorAll('#panel-live .filter-chip').forEach(c => c.classList.remove('active'));
            event.target.closest('.filter-chip').classList.add('active');
            renderLive();
        }

        function toggleLevel(lvl) {
            liveLevels[lvl] = !liveLevels[lvl];
            document.querySelectorAll('.level-chip').forEach(el => {
                if (el.textContent === lvl) {
                    el.classList.toggle('active', liveLevels[lvl]);
                    el.classList.toggle('inactive', !liveLevels[lvl]);
                }
            });
            renderLive();
        }

        function startLive() {
            if (liveSSE) return;
            livePaused = false;
            document.getElementById('liveDot').classList.remove('paused');
            document.getElementById('liveStatus').textContent = '连接中...';
            document.getElementById('liveToggleBtn').textContent = '暂停';

            // 使用 SSE 连接
            liveSSE = new EventSource('/api/logs/sse?token=' + encodeURIComponent(getToken()));

            liveSSE.onopen = function() {
                document.getElementById('liveStatus').textContent = '实时监控中';
            };

            liveSSE.onmessage = function(e) {
                try {
                    const entry = JSON.parse(e.data);
                    if (!livePaused) {
                        liveEntries.push(entry);
                        if (liveEntries.length > 500) liveEntries = liveEntries.slice(-500);
                        renderLive();
                        document.getElementById('liveSeq').textContent = entry.seq;
                    }
                } catch(err) {}
            };

            liveSSE.onerror = function() {
                document.getElementById('liveStatus').textContent = '连接断开，重连中...';
                // 浏览器会自动重连 SSE
            };
        }

        function stopLive() {
            if (liveSSE) {
                liveSSE.close();
                liveSSE = null;
            }
            document.getElementById('liveDot').classList.add('paused');
            document.getElementById('liveStatus').textContent = '已停止';
            document.getElementById('liveToggleBtn').textContent = '继续';
        }

        function toggleLive() {
            livePaused = !livePaused;
            if (livePaused) {
                document.getElementById('liveDot').classList.add('paused');
                document.getElementById('liveStatus').textContent = '已暂停';
                document.getElementById('liveToggleBtn').textContent = '继续';
            } else {
                document.getElementById('liveDot').classList.remove('paused');
                document.getElementById('liveStatus').textContent = '实时监控中';
                document.getElementById('liveToggleBtn').textContent = '暂停';
            }
        }

        function renderLive() {
            const search = (document.getElementById('liveSearch')?.value || '').toLowerCase().trim();
            let filtered = liveEntries;

            if (liveFilter) filtered = filtered.filter(e => e.category === liveFilter);
            if (search) filtered = filtered.filter(e => e.message.toLowerCase().includes(search));
            filtered = filtered.filter(e => liveLevels[e.level]);

            renderLogEntries('liveLogStream', filtered.slice(-200).reverse());
        }

        function clearLiveLogs() {
            liveEntries = [];
            document.getElementById('liveLogStream').innerHTML = '<div class="empty" style="padding:40px;">已清空，等待新日志...</div>';
            document.getElementById('liveSeq').textContent = '0';
        }

        // ---- 通用日志渲染 ----
        const CATEGORY_LABELS = {
            message: '消息', connection: '连接', plugin: '插件', system: '系统', framework: '框架'
        };

        function renderLogEntries(containerId, entries) {
            const el = document.getElementById(containerId);
            if (!entries || entries.length === 0) {
                el.innerHTML = '<div class="empty" style="padding:40px;">暂无日志记录</div>';
                return;
            }
            el.innerHTML = entries.map(e => {
                const t = new Date(e.time * 1000);
                const pad = n => String(n).padStart(2,'0');
                const ts = `${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}`;
                const catClass = `tag-${e.category}`;
                const catLabel = CATEGORY_LABELS[e.category] || e.category;
                const lvlClass = `lvl-${e.level}`;
                let detailHtml = '';
                if (e.detail && Object.keys(e.detail).length > 0) {
                    const lines = Object.entries(e.detail)
                        .filter(([k,v]) => v !== null && v !== undefined && v !== '')
                        .map(([k,v]) => `${k}: ${typeof v === 'object' ? JSON.stringify(v) : v}`);
                    if (lines.length > 0) {
                        detailHtml = `<div class="log-detail">${escapeHtml(lines.join('\n'))}</div>`;
                    }
                }
                const sourceHtml = e.source ? `<span class="log-source" title="${escapeHtml(e.source)}">${escapeHtml(e.source)}</span>` : '';
                return `<div class="log-entry">
                    <span class="log-time">${ts}</span>
                    <span class="log-tag"><span class="badge ${catClass}">${catLabel}</span></span>
                    <span class="log-level ${lvlClass}">${e.level}</span>
                    ${sourceHtml}
                    <div class="log-msg">${escapeHtml(e.message)}${detailHtml}</div>
                </div>`;
            }).join('');
        }
    </script>
</body>
</html>
