<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · ZCBOT 管理面板</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">ZC</div>
      <div class="login-title">ZCBOT 管理面板</div>
      <div class="login-sub">OneBot QQ 机器人统一管理平台</div>

      <form id="loginForm">
        <div class="form-row">
          <label for="username">用户名</label>
          <input class="input" id="username" placeholder="请输入用户名" autocomplete="username" required>
        </div>
        <div class="form-row">
          <label for="password">密码</label>
          <input class="input" id="password" type="password" placeholder="请输入密码" autocomplete="current-password" required>
        </div>
        <button class="btn primary" type="submit" id="loginBtn">登 录</button>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toasts"></div>
  <script>
    const TOKEN_KEY = 'zcbot_token';

    function toast(msg, type = 'info') {
      const c = document.getElementById('toasts');
      const t = document.createElement('div');
      t.className = 'toast ' + type;
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'all .3s'; setTimeout(() => t.remove(), 300); }, 3000);
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true; btn.textContent = '登录中...';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.code === 0) {
          localStorage.setItem(TOKEN_KEY, data.data.token);
          toast('登录成功', 'success');
          location.href = '/';
        } else {
          toast(data.msg || ('登录失败 (' + res.status + ')'), 'error');
        }
      } catch (err) {
        toast('网络错误: ' + err.message, 'error');
      } finally {
        btn.disabled = false; btn.textContent = '登 录';
      }
    });

    // 已登录则直接进入
    if (localStorage.getItem(TOKEN_KEY)) {
      fetch('/api/me', { headers: { Authorization: 'Bearer ' + localStorage.getItem(TOKEN_KEY) } })
        .then(r => r.json())
        .then(d => { if (d.code === 0) location.href = '/'; })
        .catch(() => {});
    }
  </script>
</body>
</html>
