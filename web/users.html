<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户与群 · zcbot</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .section-title { font-size:16px;font-weight:600;margin-bottom:8px;color:var(--text); }
        .admin-tbl { margin-top:8px; }
        .admin-tbl .role-badge { padding:2px 10px;border-radius:10px;font-size:12px; }
        .role-badge.super { background:#eef2ff;color:#4f46e5; }
        .role-badge.admin { background:#fef3c7;color:#d97706; }
        .role-badge.member { background:#f3f4f6;color:#6b7280; }
        .role-badge.owner { background:#fce7f3;color:#db2777; }
        .role-select { padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--bg);color:var(--text);font-family:inherit; }
        .role-select:focus { border-color:var(--accent);outline:none; }
    </style>
</head>
<body>
    <div class="main">
        <h1 class="page-title">用户与群</h1>
        <p class="page-subtitle">管理 QQ 用户、群聊信息与后台管理员账号</p>

        <!-- 用户管理 -->
        <div class="card">
            <div class="card-title">用户列表</div>
            <p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px;">
                此处管理 QQ 用户。在 <code>users.role</code> 列设为 <code>super</code> 可将该 QQ 标记为超级管理员（在群聊中有超管权限）。
            </p>
            <div class="search-bar">
                <input type="text" class="inp" id="userSearch" placeholder="搜索昵称、QQ号或备注..." onkeydown="if(event.key==='Enter')loadUsers(1)">
                <button class="btn btn-sm" onclick="loadUsers(1)">搜索</button>
            </div>
            <div id="userArea"><div class="empty"><div class="loading-spinner"></div> 加载中...</div></div>
            <div id="userPager" class="pagination"></div>
        </div>

        <!-- 群管理 -->
        <div class="card">
            <div class="card-title">群列表</div>
            <div id="groupArea"><div class="empty"><div class="loading-spinner"></div> 加载中...</div></div>
        </div>

        <!-- 管理员管理（仅超管可见） -->
        <div class="card" id="adminCard" style="display:none;">
            <div class="card-title">后台管理员账号</div>
            <p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px;">
                管理 Web UI 登录账号。角色分为 <span class="role-badge super">super</span>（超级管理员）和 <span class="role-badge admin">admin</span>（管理员）。
            </p>
            <div style="margin-bottom:12px;">
                <button class="btn btn-sm" onclick="showAddAdmin()">+ 添加管理员</button>
            </div>
            <div id="adminArea"><div class="empty"><div class="loading-spinner"></div> 加载中...</div></div>
        </div>
    </div>

    <!-- 添加管理员弹窗 -->
    <div class="overlay" id="addAdminOverlay">
        <div class="modal" style="max-width:420px;">
            <div class="modal-header">
                <span class="modal-title">添加管理员</span>
                <button class="modal-close" onclick="closeOverlay('addAdminOverlay')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" class="inp" id="newAdminUsername" placeholder="登录用户名">
                </div>
                <div class="form-group">
                    <label>密码（至少6位）</label>
                    <input type="password" class="inp" id="newAdminPassword" placeholder="登录密码">
                </div>
                <div class="form-group">
                    <label>角色</label>
                    <select class="inp" id="newAdminRole">
                        <option value="admin">管理员（admin）</option>
                        <option value="super">超级管理员（super）</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline btn-sm" onclick="closeOverlay('addAdminOverlay')">取消</button>
                <button class="btn btn-sm" onclick="doAddAdmin()">确认添加</button>
            </div>
        </div>
    </div>



    <script src="/js/common.js"></script>
    <script>
        let userPage = 1;
        let currentAdmin = null;

        initPage('users', async function(admin) {
            currentAdmin = admin;
            await loadUsers(1);
            await loadGroups();
            if (admin.role === 'super') {
                document.getElementById('adminCard').style.display = 'block';
                await loadAdmins();
            }
        });

        // ─── 用户 ───
        async function loadUsers(page) {
            userPage = page;
            const keyword = document.getElementById('userSearch').value.trim();
            let url = `/api/users?page=${page}&size=30`;
            if (keyword) url += `&keyword=${encodeURIComponent(keyword)}`;
            const res = await api(url);
            if (!res || res.code !== 0) return;
            const area = document.getElementById('userArea');
            const rows = res.data || [];
            if (rows.length === 0) {
                area.innerHTML = '<div class="empty">暂无用户数据</div>';
                document.getElementById('userPager').innerHTML = '';
                return;
            }
            const roleLabel = { super: '超管', owner: '群主', admin: '群管', member: '成员' };
            const roleClass = { super: 'super', owner: 'owner', admin: 'admin', member: 'member' };
            area.innerHTML = `<div class="tbl-wrap"><table class="tbl">
                <thead><tr><th>QQ号</th><th>昵称</th><th>备注</th><th>角色</th><th>好友</th><th>黑名单</th><th>最后活跃</th><th>操作</th></tr></thead>
                <tbody>${rows.map(u => `
                    <tr>
                        <td>${u.user_id}</td>
                        <td>${escapeHtml(u.nickname || '-')}</td>
                        <td>${escapeHtml(u.remark || '-')}</td>
                        <td>
                            <span class="role-badge ${u.role === 'super' ? 'super' : 'member'}">${u.role === 'super' ? '超级管理员' : '普通用户'}</span>
                            ${currentAdmin && currentAdmin.role === 'super' ? `
                                <select class="role-select" onchange="setUserRole(${u.user_id}, this.value)">
                                    <option value="" ${u.role === '' ? 'selected' : ''}>普通用户</option>
                                    <option value="super" ${u.role === 'super' ? 'selected' : ''}>超级管理员</option>
                                </select>
                            ` : ''}
                        </td>
                        <td>${u.is_friend ? '<span class="badge badge-ok">是</span>' : '<span class="badge badge-dim">否</span>'}</td>
                        <td>${u.is_blacklist ? '<span class="badge badge-error">已拉黑</span>' : '<span class="badge badge-ok">正常</span>'}</td>
                        <td>${timeAgo(u.last_active_at)}</td>
                        <td><button class="btn btn-outline btn-sm" onclick="toggleUserBlacklist(${u.user_id}, ${u.is_blacklist ? 0 : 1})">${u.is_blacklist ? '取消拉黑' : '拉黑'}</button></td>
                    </tr>`).join('')}
                </tbody></table></div>`;
            renderPager('userPager', page, Math.ceil(res.total / res.size), loadUsers);
        }

        async function setUserRole(userId, role) {
            const res = await api(`/api/users/${userId}/role`, {
                method: 'PUT',
                body: JSON.stringify({ role })
            });
            if (res) toast(res.msg, res.code === 0 ? 'ok' : 'err');
            if (res && res.code === 0) loadUsers(userPage);
        }

        async function toggleUserBlacklist(userId, isBlacklist) {
            const res = await api(`/api/users/${userId}/blacklist`, {
                method: 'POST',
                body: JSON.stringify({ is_blacklist: !!isBlacklist })
            });
            if (res) toast(res.msg, res.code === 0 ? 'ok' : 'err');
            if (res && res.code === 0) loadUsers(userPage);
        }

        // ─── 群 ───
        async function loadGroups() {
            const res = await api('/api/groups');
            if (!res || res.code !== 0) return;
            const area = document.getElementById('groupArea');
            const rows = res.data || [];
            if (rows.length === 0) {
                area.innerHTML = '<div class="empty">暂无群数据</div>';
                return;
            }
            area.innerHTML = `<div class="tbl-wrap"><table class="tbl">
                <thead><tr><th>群号</th><th>群名称</th><th>成员数</th><th>状态</th><th>黑名单</th><th>加入时间</th><th>操作</th></tr></thead>
                <tbody>${rows.map(g => `
                    <tr>
                        <td>${g.group_id}</td>
                        <td>${escapeHtml(g.group_name || '-')}</td>
                        <td>${g.member_count || 0} / ${g.max_member_count || 0}</td>
                        <td>${g.is_active ? '<span class="badge badge-ok">活跃</span>' : '<span class="badge badge-dim"> inactive</span>'}</td>
                        <td>${g.is_blacklist ? '<span class="badge badge-error">已拉黑</span>' : '<span class="badge badge-ok">正常</span>'}</td>
                        <td>${formatDate(g.join_at)}</td>
                        <td><button class="btn btn-outline btn-sm" onclick="toggleGroupBlacklist(${g.group_id}, ${g.is_blacklist ? 0 : 1})">${g.is_blacklist ? '取消拉黑' : '拉黑'}</button></td>
                    </tr>`).join('')}
                </tbody></table></div>`;
        }

        async function toggleGroupBlacklist(groupId, isBlacklist) {
            const res = await api(`/api/groups/${groupId}/blacklist`, {
                method: 'POST',
                body: JSON.stringify({ is_blacklist: !!isBlacklist })
            });
            if (res) toast(res.msg, res.code === 0 ? 'ok' : 'err');
            if (res && res.code === 0) loadGroups();
        }

        // ─── 管理员管理 ───
        let adminList = [];

        async function loadAdmins() {
            const res = await api('/api/admins');
            if (!res || res.code !== 0) return;
            adminList = res.data || [];
            renderAdmins();
        }

        function renderAdmins() {
            const area = document.getElementById('adminArea');
            if (adminList.length === 0) {
                area.innerHTML = '<div class="empty">暂无管理员账号</div>';
                return;
            }
            area.innerHTML = `<div class="tbl-wrap admin-tbl"><table class="tbl">
                <thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>状态</th><th>最后登录</th><th>最后IP</th><th>创建时间</th><th>操作</th></tr></thead>
                <tbody>${adminList.map(a => `
                    <tr>
                        <td>${a.id}</td>
                        <td><strong>${escapeHtml(a.username)}</strong></td>
                        <td><span class="role-badge ${a.role}">${a.role === 'super' ? '超级管理员' : '管理员'}</span></td>
                        <td>${a.is_active ? '<span class="badge badge-ok">启用</span>' : '<span class="badge badge-error">禁用</span>'}</td>
                        <td style="font-size:12px;">${formatDate(a.last_login_at)}</td>
                        <td style="font-size:12px;">${escapeHtml(a.last_login_ip || '-')}</td>
                        <td style="font-size:12px;">${formatDate(a.created_at)}</td>
                        <td>
                            ${a.id !== (currentAdmin ? currentAdmin.id : -1) ? `<button class="btn btn-danger btn-sm" onclick="deleteAdmin(${a.id}, '${escapeHtml(a.username)}')">删除</button>` : '<span style="font-size:12px;color:var(--text-secondary);">当前用户</span>'}
                        </td>
                    </tr>`).join('')}
                </tbody></table></div>`;
        }

        function showAddAdmin() {
            document.getElementById('newAdminUsername').value = '';
            document.getElementById('newAdminPassword').value = '';
            document.getElementById('newAdminRole').value = 'admin';
            showOverlay('addAdminOverlay');
        }

        async function doAddAdmin() {
            const username = document.getElementById('newAdminUsername').value.trim();
            const password = document.getElementById('newAdminPassword').value;
            const role = document.getElementById('newAdminRole').value;

            if (!username) { toast('请输入用户名', 'err'); return; }
            if (!password || password.length < 6) { toast('密码至少6位', 'err'); return; }

            const res = await api('/api/admins', {
                method: 'POST',
                body: JSON.stringify({ username, password, role })
            });
            if (res) toast(res.msg, res.code === 0 ? 'ok' : 'err');
            if (res && res.code === 0) {
                closeOverlay('addAdminOverlay');
                loadAdmins();
            }
        }

        async function deleteAdmin(adminId, username) {
            if (!confirmDialog(`确定删除管理员 [${username}]？此操作不可恢复。`)) return;
            const res = await api(`/api/admins/${adminId}`, { method: 'DELETE' });
            if (res) toast(res.msg, res.code === 0 ? 'ok' : 'err');
            if (res && res.code === 0) loadAdmins();
        }

        // ─── 分页渲染 ───
        function renderPager(containerId, current, totalPages, callback) {
            const el = document.getElementById(containerId);
            if (totalPages <= 1) { el.innerHTML = ''; return; }
            let html = '';
            html += `<button ${current <= 1 ? 'disabled' : ''} onclick="${callback.name}(${current - 1})">上一页</button>`;
            const start = Math.max(1, current - 2);
            const end = Math.min(totalPages, current + 2);
            if (start > 1) html += `<button onclick="${callback.name}(1)">1</button>`;
            if (start > 2) html += '<button disabled>...</button>';
            for (let i = start; i <= end; i++) {
                html += `<button class="${i === current ? 'active' : ''}" onclick="${callback.name}(${i})">${i}</button>`;
            }
            if (end < totalPages - 1) html += '<button disabled>...</button>';
            if (end < totalPages) html += `<button onclick="${callback.name}(${totalPages})">${totalPages}</button>`;
            html += `<button ${current >= totalPages ? 'disabled' : ''} onclick="${callback.name}(${current + 1})">下一页</button>`;
            el.innerHTML = html;
        }

        // ─── 弹窗控制 ───
        function showOverlay(id) { document.getElementById(id).classList.add('show'); }
        function closeOverlay(id) { document.getElementById(id).classList.remove('show'); }
        document.getElementById('addAdminOverlay').addEventListener('click', e => {
            if (e.target.id === 'addAdminOverlay') closeOverlay('addAdminOverlay');
        });
    </script>
</body>
</html>
