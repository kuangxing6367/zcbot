<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZCBOT 管理面板</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <!-- 侧边导航（由 app.js 渲染） -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo">ZC</div>
        <div class="brand-name">ZCBOT</div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="nav-item" data-route="settings"><span class="icon">⚙</span><span class="label">设置</span></div>
      </div>
    </aside>

    <!-- 主区域 -->
    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn">☰</button>
        <div class="topbar-title" id="pageTitle">仪表盘</div>
        <div class="user" id="userInfo"></div>
      </header>
      <main class="content" id="view"></main>
      <footer class="statusbar">
        <span class="sb-left" id="sbLeft"><span class="sb-icon">⚡</span>ZCBOT</span>
        <span class="sb-right" id="sbRight">
          <span class="sb-item" id="sbConn">连接: -</span>
          <span class="sb-item" id="sbPlugins">插件: -</span>
          <span class="sb-item" id="sbTime">-</span>
        </span>
      </footer>
    </div>
  </div>

  <div class="toast-container" id="toasts"></div>
  <script src="/js/app.js"></script>
  <script src="/js/views.js"></script>
</body>
</html>
