<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>命令管理 · zcbot</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .tab-nav { display:flex; gap:4px; background:var(--card-bg); border-radius:12px; padding:4px; box-shadow:var(--shadow); margin-bottom:20px; overflow-x:auto; }
        .tab-item { flex:1; min-width:120px; padding:10px 16px; border:none; background:transparent; color:var(--text-secondary); font-size:14px; font-weight:500; cursor:pointer; border-radius:8px; transition:all 0.2s; white-space:nowrap; font-family:inherit; }
        .tab-item:hover { background:var(--bg); color:var(--text); }
        .tab-item.active { background:var(--accent); color:#fff; box-shadow:0 2px 8px rgba(99,102,241,0.3); }
        .tab-panel { display:none; }
        .tab-panel.active { display:block; }
        .search-bar { display:flex; gap:8px; margin-bottom:16px; }
        .search-bar .inp { flex:1; }
        .cmd-alias-input { width:100%; padding:4px 8px; border:1px solid var(--border); border-radius:6px; font-size:13px; background:var(--bg); color:var(--text); font-family:inherit; }
        .cmd-alias-input:focus { border-color:var(--accent); outline:none; }
        .filter-chip { padding:6px 14px; border:1px solid var(--border); background:var(--card-bg); color:var(--text-secondary); border-radius:20px; font-size:13px; cursor:pointer; transition:all 0.15s; font-family:inherit; }
        .filter-chip:hover { border-color:var(--accent); color:var(--text); }
        .filter-chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
    </style>
</head>
<body>
    <div class="main">
        <h1 class="page-title">命令管理</h1>
        <p class="page-subtitle">静态命令（插件注册，支持别名） · 动态命令（自定义关键词回复）</p>

        <!-- Tab 导航 -->
        <div class="tab-nav">
            <button class="tab-item active" onclick="switchTab('static')">静态命令</button>
            <button class="tab-item" onclick="switchTab('dynamic')">动态命令</button>
        </div>

        <!-- 静态命令面板 -->
        <div class="tab-panel active" id="panel-static">
            <div class="card">
                <div class="card-title">静态命令（插件注册）</div>
                <p style="font-size:14px;color:var(--text-secondary);margin-bottom:16px;">
                    静态命令由插件通过 <code>ctx.command()</code> 注册，支持自定义别名（参考 AstrBot 命令系统）。别名可自由修改，重启不丢失。
                </p>
                <div class="search-bar">
                    <input type="text" class="inp" id="staticSearch" placeholder="搜索插件名、匹配规则、别名..." oninput="filterStatic()">
                    <button class="filter-chip active" onclick="setStaticFilter('')" id="f-all">全部</button>
                    <button class="filter-chip" onclick="setStaticFilter('active')" id="f-active">已启用</button>
                    <button class="filter-chip" onclick="setStaticFilter('disabled')" id="f-disabled">已禁用</button>
                </div>
                <div id="staticArea"><div class="empty"><div class="loading-spinner"></div> 加载中...</div></div>
            </div>
        </div>

        <!-- 动态命令面板 -->
        <div class="tab-panel" id="panel-dynamic">
            <div class="card">
                <div class="card-title">动态命令</div>
                <p style="font-size:14px;color:var(--text-secondary);margin-bottom:16px;">
                    动态命令由插件在运行时注册添加，仅作展示。关键词匹配功能由插件自身实现。
                </p>
                <div id="dynamicArea"><div class="empty"><div class="loading-spinner"></div> 加载中...</div></div>
            </div>
        </div>
    </div>

    <!-- 别名编辑弹窗 -->
    <div class="overlay" id="aliasOverlay">
        <div class="modal" style="max-width:520px;">
            <div class="modal-header">
                <span class="modal-title">编辑命令别名</span>
                <button class="modal-close" onclick="closeOverlay('aliasOverlay')">&times;</button>
            </div>
            <div class="modal-body" id="aliasBody"></div>
            <div class="modal-footer">
                <button class="btn btn-outline btn-sm" onclick="closeOverlay('aliasOverlay')">取消</button>
                <button class="btn btn-sm" onclick="saveAlias()">保存</button>
            </div>
        </div>
    </div>



    <script src="/js/common.js"></script>
    <script>
        let staticFilter = '';
        let editingCmdId = null;
        let allStatic = [];
        let allDynamic = [];

        initPage('commands', async function() {
            await loadStatic();
            await loadDynamic();
        });

        // ─── Tab 切换 ───
        function switchTab(name) {
            document.querySelectorAll('.tab-item').forEach((el, i) => {
                el.classList.toggle('active', ['static','dynamic'][i] === name);
            });
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('panel-' + name).classList.add('active');
        }

        function setStaticFilter(f) {
            staticFilter = f;
            document.querySelectorAll('#panel-static .filter-chip').forEach(c => c.classList.remove('active'));
            event.target.closest('.filter-chip').classList.add('active');
            renderStatic();
        }

        function filterStatic() { renderStatic(); }
        function filterDynamic() { renderDynamic(); }

        // ─── 静态命令 ───
        async function loadStatic() {
            const res = await api('/api/commands');
            if (!res || res.code !== 0) return;
            allStatic = res.data || [];
            renderStatic();
        }

        function renderStatic() {
            const area = document.getElementById('staticArea');
            const search = document.getElementById('staticSearch').value.toLowerCase().trim();
            let rows = allStatic;

            if (search) {
                rows = rows.filter(c =>
                    (c.plugin_name || '').toLowerCase().includes(search) ||
                    (c.pattern || '').toLowerCase().includes(search) ||
                    (c.alias || '').toLowerCase().includes(search) ||
                    (c.handler || '').toLowerCase().includes(search) ||
                    (c.description || '').toLowerCase().includes(search)
                );
            }

            if (staticFilter === 'active') rows = rows.filter(c => c.is_active);
            if (staticFilter === 'disabled') rows = rows.filter(c => !c.is_active);

            if (rows.length === 0) {
                area.innerHTML = '<div class="empty">暂无静态命令</div>';
                return;
            }

            const requireLabel = { 'admin': '管理员', 'super': '超管', '': '所有人' };
            const requireClass = { 'admin': 'badge-warn', 'super': 'badge-error', '': '' };
            area.innerHTML = `<div class="tbl-wrap"><table class="tbl">
                <thead><tr>
                    <th>插件</th><th>匹配规则</th><th>别名</th><th>描述</th>
                    <th>优先级</th><th>权限</th><th>处理函数</th><th>命中</th><th>状态</th><th>操作</th>
                </tr></thead>
                <tbody>${rows.map(c => `
                    <tr style="${c.is_active ? '' : 'opacity:0.5;'}">
                        <td><span class="badge badge-info">${escapeHtml(c.plugin_name)}</span></td>
                        <td><code style="font-size:12px;">${escapeHtml(c.pattern)}</code></td>
                        <td style="min-width:120px;">
                            ${c.alias ? c.alias.split(',').map(a => `<span class="badge badge-dim" style="margin:2px;">${escapeHtml(a.trim())}</span>`).join('') : '<span style="color:var(--text-secondary);font-size:12px;">-</span>'}
                        </td>
                        <td style="max-width:180px;font-size:12px;color:var(--text-secondary);">${escapeHtml(c.description || '-')}</td>
                        <td>${c.priority}</td>
                        <td>${c.require_level ? `<span class="badge ${requireClass[c.require_level] || 'badge-dim'}">${requireLabel[c.require_level] || c.require_level}</span>` : '<span style="color:var(--text-secondary);font-size:12px;">所有人</span>'}</td>
                        <td><code style="font-size:12px;">${escapeHtml(c.handler || '-')}</code></td>
                        <td>${c.hit_count || 0}</td>
                        <td>${c.is_active ? '<span class="badge badge-ok">启用</span>' : '<span class="badge badge-error">禁用</span>'}</td>
                        <td style="white-space:nowrap;">
                            <button class="btn btn-outline btn-sm" onclick="editAlias(${c.id})">别名</button>
                            <button class="btn btn-outline btn-sm" onclick="toggleStatic(${c.id}, ${c.is_active ? 0 : 1})">${c.is_active ? '禁用' : '启用'}</button>
                        </td>
                    </tr>`).join('')}
                </tbody></table></div>`;
        }

        function editAlias(id) {
            const cmd = allStatic.find(c => c.id === id);
            if (!cmd) return;
            editingCmdId = id;
            document.getElementById('aliasBody').innerHTML = `
                <div class="form-group">
                    <label>所属插件</label>
                    <div style="font-size:14px;color:var(--text-secondary);">${escapeHtml(cmd.plugin_name)}</div>
                </div>
                <div class="form-group">
                    <label>原始匹配规则</label>
                    <div style="font-size:13px;font-family:monospace;color:var(--text-secondary);">${escapeHtml(cmd.pattern)}</div>
                </div>
                <div class="form-group">
                    <label>别名（逗号分隔）</label>
                    <input type="text" class="inp" id="aliasInput" value="${escapeHtml(cmd.alias || '')}" placeholder="如 /help,/h,帮助">
                    <div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">用户发送别名时也会触发此命令。每个别名将作为前缀匹配。</div>
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <input type="text" class="inp" id="descInput" value="${escapeHtml(cmd.description || '')}" placeholder="命令描述">
                </div>
                <div class="form-group">
                    <label>权限等级</label>
                    <select class="inp" id="permInput" style="width:100%;">
                        <option value="" ${cmd.require_level === '' || !cmd.require_level ? 'selected' : ''}>所有人</option>
                        <option value="admin" ${cmd.require_level === 'admin' ? 'selected' : ''}>管理员/群主/超管</option>
                        <option value="super" ${cmd.require_level === 'super' ? 'selected' : ''}>超管</option>
                    </select>
                </div>`;
            showOverlay('aliasOverlay');
        }

        async function saveAlias() {
            if (!editingCmdId) return;
            const alias = document.getElementById('aliasInput').value.trim();
            const description = document.getElementById('descInput').value.trim();
            const requireLevel = document.getElementById('permInput').value;
            const res = await api(`/api/commands/${editingCmdId}/alias`, {
                method: 'PUT',
                body: JSON.stringify({ alias, description, require_level: requireLevel })
            });
            if (res) toast(res.msg, res.code === 0 ? 'ok' : 'err');
            if (res && res.code === 0) {
                closeOverlay('aliasOverlay');
                loadStatic();
            }
        }

        async function toggleStatic(id, isActive) {
            const res = await api(`/api/commands/${id}/toggle`, {
                method: 'POST',
                body: JSON.stringify({ is_active: !!isActive })
            });
            if (res) toast(res.msg, res.code === 0 ? 'ok' : 'err');
            if (res && res.code === 0) loadStatic();
        }

        // ─── 动态命令（仅展示，由插件注册）───
        async function loadDynamic() {
            const res = await api('/api/commands/dynamic');
            if (!res || res.code !== 0) return;
            allDynamic = res.data || [];
            renderDynamic();
        }

        function renderDynamic() {
            const area = document.getElementById('dynamicArea');
            const rows = allDynamic;

            if (rows.length === 0) {
                area.innerHTML = '<div class="empty">暂无动态命令</div>';
                return;
            }

            const matchLabel = { exact: '精确', prefix: '前缀', regex: '正则' };
            area.innerHTML = `<div class="tbl-wrap"><table class="tbl">
                <thead><tr><th>ID</th><th>关键词</th><th>回复</th><th>匹配</th><th>来源</th><th>命中</th><th>创建时间</th><th>状态</th></tr></thead>
                <tbody>${rows.map(c => `
                    <tr style="${c.is_active ? '' : 'opacity:0.5;'}">
                        <td>${c.id}</td>
                        <td><strong>${escapeHtml(c.keyword)}</strong></td>
                        <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(c.response)}">${escapeHtml(c.response)}</td>
                        <td><span class="badge badge-info">${matchLabel[c.match_type] || c.match_type}</span></td>
                        <td><span class="badge badge-dim">${escapeHtml(c.plugin_name || '-')}</span></td>
                        <td>${c.hit_count || 0}</td>
                        <td style="font-size:12px;">${formatDate(c.created_at)}</td>
                        <td>${c.is_active ? '<span class="badge badge-ok">启用</span>' : '<span class="badge badge-dim">禁用</span>'}</td>
                    </tr>`).join('')}
                </tbody></table></div>`;
        }

        // ─── 弹窗控制 ───
        function showOverlay(id) { document.getElementById(id).classList.add('show'); }
        function closeOverlay(id) { document.getElementById(id).classList.remove('show'); }
        ['aliasOverlay', 'editOverlay'].forEach(id => {
            document.getElementById(id).addEventListener('click', e => {
                if (e.target.id === id) closeOverlay(id);
            });
        });
    </script>
</body>
</html>
