# ============================================================
# ZCBOT · pyproject.toml（PEP 621 项目元数据 + 工具配置）
#
# 说明：
# - 本仓库以「源码方式」运行（python startup.py）为主，同时支持打包为 wheel
#   分发（下方 [build-system] + [tool.setuptools] 已声明，可 pip install . 或构建上传 PyPI）。
# - 依赖有两个入口，内容必须保持同步：
#     1) requirements.txt —— 传统入口，startup.py 启动自检读取的就是它（兼容保留）
#     2) 本文件 [project.dependencies] / [project.optional-dependencies]
#   修改依赖时请同时更新两处。
# - flask / flask-cors / waitress 是**核心依赖**（core_plugins.yaml 里 webui
#   默认 enabled: true，默认安装路径就会加载 Web 后台）；`[web]` extra 仅为
#   兼容旧文档 `pip install "zcbot[web]"` 保留，内容已与核心依赖一致。
# ============================================================

[project]
name = "zcbot"
version = "1.21.1"
description = "ZCBOT 事件驱动 IM 平台：内核 + 扩展点契约 + 协议无关的接入端（以插件形式提供多平台接入）"
readme = "README.md"
requires-python = ">=3.10"
# PEP 639：许可用 SPDX 表达式（双协议，任选其一），不再用已弃用的
# `License :: OSI Approved :: ...` classifier（PEP 639 起不推荐混用）。
license = "MIT OR Apache-2.0"
# 显式声明随包分发的许可文件。缺这条时，识别工具拿到的「许可文件」集合
# 完全依赖打包器的默认猜测，Apache 那份很容易被漏掉。
license-files = ["LICENSE", "LICENSE-APACHE"]
authors = [{ name = "zgric" }]
keywords = ["telegram", "discord", "bot", "plugin", "event-driven", "framework", "im", "chatbot"]

# 核心依赖（SQLite 模式必须）—— 与 requirements.txt 上半段保持一致
#
# flask / flask-cors / waitress 放在核心依赖里而不是可选组：core_plugins.yaml
# 中 `webui` 默认 `enabled: true`，即默认安装路径就会加载 Web 后台。把它们留在
# `[web]` 可选组时，`pip install zcbot` 装完首次启动必然缺 flask，只能靠运行时
# 依赖自愈现场联网补装——离线 / 内网环境装完就是起不来，而这和 README 的
# 安装命令对不上。`[web]` extra 保留，装它仍然有效（旧文档/脚本不受影响）。
dependencies = [
    "websockets>=12.0",
    "apscheduler>=3.10.0",
    "pyyaml>=6.0",
    "bcrypt>=4.0.0",
    "requests>=2.28.0",
    "psutil>=5.9.0",
    "flask>=2.3.0",
    "flask-cors>=4.0.0",
    "waitress>=3.0.0",
]

[project.optional-dependencies]
# MySQL 可选依赖（database.type: mysql 时使用；运行时也会自动安装）
mysql = [
    "pymysql>=1.0.0",
    "DBUtils>=3.0.0",
]
# Web 管理后台：相关包已在核心依赖里（见上），此组仅为兼容旧文档
# `pip install "zcbot[web]"` 保留，内容与核心依赖一致。
web = [
    "flask>=2.3.0",
    "flask-cors>=4.0.0",
    "waitress>=3.0.0",
]
# 插件可选依赖（仅当插件需要时安装，框架本体不依赖）
plugins = [
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
]
# 开发 / 测试依赖：pytest-asyncio 是**必需**项，不是可选项。
# 下方 [tool.pytest.ini_options] 的 asyncio_mode = "auto" 只有装了它才生效；
# 缺它时 pytest 会警告 "Unknown config option: asyncio_mode"，并把 tests/ 下
# 所有裸 async def 用例判为 "async def functions are not natively supported" 失败
# ——实测 28 条用例因此长期红着，看起来像功能坏了，其实是环境没装插件。
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    # CI 用 `pytest --timeout=120` 防挂死；不装它这条命令会直接报
    # "unrecognized arguments: --timeout"，本地按文档装 dev 组也必须能复现 CI。
    "pytest-timeout>=2.2",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/kuangxing6367/zcbot"
Repository = "https://github.com/kuangxing6367/zcbot"
Issues = "https://github.com/kuangxing6367/zcbot/issues"

# ============================================================
# 打包（PyPI / pip install）
# ============================================================
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
zb = "framework.cli:main"
zcbot = "framework.cli:main"

[tool.setuptools]
include-package-data = true
py-modules = ["startup", "main", "zb"]

[tool.setuptools.packages.find]
include = ["framework*", "core_plugins*", "plugins*", "sql*"]
# framework/iipc/tools/ 是开发期自检工具（联调探针、压测、e2e 脚本和
# iipc_hardening_test.py），运行时不 import 任何一个，之前被当作命名空间包
# 整目录打进 wheel。发行包里塞测试与压测脚本，等于让每个用户多下一份
# 用不到的东西，还会被扫描工具当成"包内有测试代码"。
exclude = ["*.__pycache__", "*.native.target*", "framework.iipc.tools*", "*.tests*"]

# 非 package 目录下的原生二进制（image_renderer 按插件目录相对定位 native/bin/<平台>/）
# + sql 建表脚本（init_db._find_sql_file 运行时读取）
#
# 注意：image_renderer 的原生扩展（7 平台约 7MB）与字体子集（约 8MB）**刻意不入包**。
# 它们由 `image_renderer` 在首次启用时按 asset_url 下载到 data 目录（见 assets.py）；
# 发布侧用 scripts/build_render_assets.py 打包，推到独立仓库
# kuangxing6367/zcbot-render-assets 的 Release。放进 wheel 会让每次 pip 安装多下载
# 15MB，且多平台二进制里只有一个能被用到。
[tool.setuptools.package-data]
"core_plugins.image_renderer" = [
    "native/bin/*/.gitkeep",
]
"sql" = ["*.sql"]

# ============================================================
# pytest
# ============================================================
[tool.pytest.ini_options]
# tests/ 下有一批裸 async def 用例（未加 @pytest.mark.asyncio）。
# pytest-asyncio 默认 strict 模式不会执行它们，而是直接报
# "async def functions are not natively supported" 判为失败
# ——等于这些用例静默失去覆盖。开 auto 让它们真正跑起来。
# 注意：本项只有装了 pytest-asyncio 才有效，见上方 dev 可选依赖组。
asyncio_mode = "auto"
# 不显式设置时 pytest-asyncio 会打 DeprecationWarning，且未来默认作用域会变；
# 钉成 function 与现状一致，升级插件版本时不会静默改语义。
asyncio_default_fixture_loop_scope = "function"