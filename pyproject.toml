# ============================================================
# ZCBOT · pyproject.toml（PEP 621 项目元数据 + 工具配置）
#
# 说明：
# - 本仓库以「源码方式」运行（python main.py），不作为 wheel 分发，
#   故不声明 [build-system]。
# - 依赖有两个人口，内容必须保持同步：
#     1) requirements.txt —— 传统入口，main.py 启动自检读取的就是它（兼容保留）
#     2) 本文件 [project.dependencies] / [project.optional-dependencies]
#   修改依赖时请同时更新两处。
# ============================================================

[project]
name = "zcbot"
version = "1.7.0"
description = "ZCBOT 事件驱动 IM 平台：内核 + 扩展点契约 + 协议无关接入端（内置 OneBot 11 / QQ 官方 / Telegram / Discord）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "kuangxing6367" }]
keywords = ["onebot", "telegram", "discord", "qq", "bot", "plugin", "event-driven", "framework"]

# 核心依赖（SQLite 模式必须）—— 与 requirements.txt 上半段保持一致
dependencies = [
    "websockets>=12.0",
    "apscheduler>=3.10.0",
    "flask>=2.3.0",
    "flask-cors>=4.0.0",
    "pyyaml>=6.0",
    "bcrypt>=4.0.0",
    "requests>=2.28.0",
    "psutil>=5.9.0",
    "waitress>=3.0.0",
]

[project.optional-dependencies]
# MySQL 可选依赖（database.type: mysql 时使用；运行时也会自动安装）
mysql = [
    "pymysql>=1.0.0",
    "DBUtils>=3.0.0",
]
# 插件可选依赖（仅当插件需要时安装，框架本体不依赖）
plugins = [
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/kuangxing6367/zcbot"
Repository = "https://github.com/kuangxing6367/zcbot"
Issues = "https://github.com/kuangxing6367/zcbot/issues"
