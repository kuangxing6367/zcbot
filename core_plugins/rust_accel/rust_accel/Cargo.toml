[package]
name = "rust_accel"
version = "0.1.0"
edition = "2021"
description = "OneBot 11 receiver/broadcaster accelerator for zgric framework (core plugin)"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-tungstenite = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = true